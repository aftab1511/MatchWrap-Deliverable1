<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - MatchWrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold text-success" href="index.html">
                <i class="bi bi-shield-fill-check me-2"></i>MatchWrap
            </a>
            <a href="index.html" class="btn btn-outline-light btn-sm">Back to Home</a>
        </div>
    </nav>

    <!-- Registration Form -->
    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-lg border-0 rounded-3">
                    <div class="card-body p-4 p-sm-5">
                        <div class="text-center mb-4">
                            <h3 class="fw-bold">Create an Account</h3>
                            <p class="text-muted small">Join MatchWrap to vote, comment, and review football matches</p>
                        </div>

                        <form>
                            <div class="row g-3 mb-3">
                                <div class="col-sm-6">
                                    <label class="form-label fw-bold small">First Name</label>
                                    <input type="text" class="form-control" placeholder="Aftab" required>
                                </div>
                                <div class="col-sm-6">
                                    <label class="form-label fw-bold small">Last Name</label>
                                    <input type="text" class="form-control" placeholder="Nawaz" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold small">Email Address</label>
                                <input type="email" class="form-control" placeholder="student@example.com" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold small">Select Role</label>
                                <select class="form-select">
                                    <option value="1" selected>General User (Fan / Reviewer)</option>
                                    <option value="2">Match Analyst (Content Creator)</option>
                                    <option value="3">Administrator (Platform Overseer)</option>
                                </select>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-sm-6">
                                    <label class="form-label fw-bold small">Password</label>
                                    <input type="password" class="form-control" placeholder="••••••••" required>
                                </div>
                                <div class="col-sm-6">
                                    <label class="form-label fw-bold small">Confirm Password</label>
                                    <input type="password" class="form-control" placeholder="••••••••" required>
                                </div>
                            </div>

                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" id="termsCheck" required>
                                <label class="form-check-label small" for="termsCheck">
                                    I agree to the <a href="static-terms.html" class="text-success">Terms of Service</a> & Privacy Policy.
                                </label>
                            </div>

                            <a href="roles/user-home.html" class="btn btn-success w-100 py-2 fw-bold">Register Account</a>
                        </form>

                        <div class="text-center mt-4 border-top pt-3">
                            <p class="small text-muted mb-0">Already registered? <a href="login.html" class="text-success fw-bold text-decoration-none">Sign In</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
